name: KB validate

# Pratinjau untuk PR yang menambah file ke kb-inbox/ atau mengubah plugin:
# menjalankan ingest pada salinan workspace (tidak di-commit) dan validasi KB.
on:
  pull_request:
    paths: ["kb-inbox/**", "kb/**", "plugins/**", ".claude-plugin/**", "standalone/**", "scripts/**"]

permissions:
  contents: read

env:
  KB_MANAGER: plugins/aigeothermal-pln/skills/geothermal-knowledge/scripts/kb_manager.py

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/aigeothermal-pln/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/aigeothermal-pln/skills/geothermal-knowledge/references/KB/KB_MANIFEST.json > /dev/null

      - name: Check existing KB
        run: python3 "$KB_MANAGER" check

      - name: Preview ingest (not committed)
        run: |
          {
            echo "## Pratinjau ingest kb-inbox"
            echo
            echo "ID final ditetapkan saat ingest di main dan dapat berbeda bila ada pengajuan lain yang masuk lebih dulu."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 "$KB_MANAGER" ingest kb-inbox --summary "$RUNNER_TEMP/kb-summary.md"
          status=$?
          cat "$RUNNER_TEMP/kb-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Check KB after preview ingest
        run: python3 "$KB_MANAGER" check

      - name: Build skill ZIP and sync manifest (smoke test)
        run: |
          python3 scripts/build_sync_manifest.py
          python3 scripts/build_skill_zips.py --out "$RUNNER_TEMP/dist"
          python3 -m py_compile standalone/aigeothermal-pln/scripts/sync.py
