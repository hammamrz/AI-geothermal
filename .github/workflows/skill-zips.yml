name: Skill ZIP

# Membangun AIGeothermal-PLN.zip (skill untuk di-upload di claude.ai) dan
# memperbarui release "skills-latest". Pengguna hanya perlu upload ulang bila
# isi folder standalone/ berubah; modul dan KB diperbarui otomatis oleh sync.py.
on:
  push:
    branches: [main]
    paths: ["standalone/**", "plugins/**", "scripts/build_skill_zips.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-zips
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_skill_zips.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: AIGeothermal-PLN
          path: dist/*.zip
      - name: Update skills-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Build otomatis dari ${GITHUB_SHA::7}. Upload AIGeothermal-PLN.zip di claude.ai → Customize → Skills → + → Upload a skill. Cukup sekali; modul dan KB selanjutnya diperbarui otomatis dari GitHub."
          if gh release view skills-latest >/dev/null 2>&1; then
            gh release edit skills-latest --notes "$notes" --target "$GITHUB_SHA"
            gh release upload skills-latest dist/AIGeothermal-PLN.zip --clobber
          else
            gh release create skills-latest dist/AIGeothermal-PLN.zip --title "AIGeothermal-PLN (latest)" --notes "$notes" --target "$GITHUB_SHA"
          fi
