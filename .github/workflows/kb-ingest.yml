name: KB ingest & sync manifest

# Dijalankan setiap ada perubahan di main pada kb-inbox/ (upload KB oleh admin),
# pada plugin, atau saat admin mem-publish GitHub Release berisi ZIP/file KB
# (jalur untuk batch besar: aset release bisa sampai 2 GB). Workflow ini:
#   0. (release) mengunduh aset release ke kb-inbox/;
#   1. memproses file/ZIP di kb-inbox/ ke KB (ID GEO-xxxx, KB_INDEX, CHANGELOG);
#   2. membangun ulang sync-manifest.json yang dibaca skill claude.ai (sync.py);
#   3. meng-commit hasilnya langsung ke main.
# Setelah commit ini, semua akun yang memakai skill mendapat versi terbaru
# pada percakapan berikutnya (sync.py update), tanpa upload ulang ZIP.
on:
  push:
    branches: [main]
    paths: ["kb-inbox/**", "plugins/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag release berisi ZIP KB untuk diproses ulang (kosongkan bila tidak ada)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: kb-ingest
  cancel-in-progress: false

env:
  KB_MANAGER: plugins/aigeothermal-pln/skills/geothermal-knowledge/scripts/kb_manager.py

jobs:
  ingest:
    # Hanya release KB (tag diawali "kb-") yang diproses; release skills-latest diabaikan.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'kb-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download KB files from release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          # Unduh ke luar repo agar aset besar yang gagal diproses tidak ikut ter-commit.
          mkdir -p "$RUNNER_TEMP/release-inbox"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release-inbox" --clobber
          ls -la "$RUNNER_TEMP/release-inbox"

      - name: Ingest release files and kb-inbox
        id: ingest
        run: |
          set +e
          code=0
          : > "$RUNNER_TEMP/kb-summary.md"
          if [ -d "$RUNNER_TEMP/release-inbox" ]; then
            python3 "$KB_MANAGER" ingest "$RUNNER_TEMP/release-inbox" --summary "$RUNNER_TEMP/s1.md" || code=1
            { echo "### Aset release"; cat "$RUNNER_TEMP/s1.md"; echo; } >> "$RUNNER_TEMP/kb-summary.md"
          fi
          python3 "$KB_MANAGER" ingest kb-inbox --summary "$RUNNER_TEMP/s2.md" || code=1
          { echo "### kb-inbox"; cat "$RUNNER_TEMP/s2.md"; } >> "$RUNNER_TEMP/kb-summary.md"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/kb-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate KB
        run: python3 "$KB_MANAGER" check

      - name: Rebuild sync manifest
        run: python3 scripts/build_sync_manifest.py

      - name: Bump plugin version
        # claude.ai dan Claude Code mendeteksi update plugin dari perubahan "version".
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          pushed_plugin=0
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! git diff --quiet "$BEFORE" HEAD -- plugins 2>/dev/null; then pushed_plugin=1; fi
          if [ -n "$(git status --porcelain -- plugins kb)" ] || [ "$pushed_plugin" = "1" ]; then
            python3 - <<'PY'
          import json, re
          p = "plugins/aigeothermal-pln/.claude-plugin/plugin.json"
          d = json.load(open(p))
          a, b, c = (int(x) for x in re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", d["version"]).groups())
          d["version"] = f"{a}.{b}.{c + 1}"
          open(p, "w").write(json.dumps(d, ensure_ascii=False, indent=2) + "\n")
          print("Plugin version ->", d["version"])
          PY
          fi

      - name: Commit to main
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Tidak ada perubahan."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A kb-inbox kb plugins/aigeothermal-pln sync-manifest.json
          rev=$(python3 -c "import json;print(json.load(open('sync-manifest.json'))['kb_revision'])")
          git commit -m "KB: ingest & sync manifest (KB revision ${rev})"
          git push origin HEAD:main

      - name: Report result on release
        if: always() && (github.event_name == 'release' || inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          { echo "## Hasil ingest KB"; echo; cat "$RUNNER_TEMP/kb-summary.md" 2>/dev/null || echo "Ingest tidak berjalan; lihat log workflow."; } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Fail if some inbox files were rejected
        if: steps.ingest.outputs.exit_code != '0'
        run: |
          echo "::error::Sebagian file di kb-inbox gagal diproses. Lihat ringkasan job; file tersebut tetap di kb-inbox sampai diperbaiki."
          exit 1
