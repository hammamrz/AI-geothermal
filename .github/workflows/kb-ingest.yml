name: KB ingest & sync manifest

# Dijalankan setiap ada perubahan di main pada kb-inbox/ (upload KB oleh admin)
# atau pada plugin. Workflow ini:
#   1. memproses file di kb-inbox/ ke KB (ID GEO-xxxx, KB_INDEX, CHANGELOG);
#   2. membangun ulang sync-manifest.json yang dibaca skill claude.ai (sync.py);
#   3. meng-commit hasilnya langsung ke main.
# Setelah commit ini, semua akun yang memakai skill mendapat versi terbaru
# pada percakapan berikutnya (sync.py update), tanpa upload ulang ZIP.
on:
  push:
    branches: [main]
    paths: ["kb-inbox/**", "plugins/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kb-ingest
  cancel-in-progress: false

env:
  KB_MANAGER: plugins/aigeothermal-pln/skills/geothermal-knowledge/scripts/kb_manager.py

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ingest kb-inbox
        id: ingest
        run: |
          set +e
          python3 "$KB_MANAGER" ingest kb-inbox --summary "$RUNNER_TEMP/kb-summary.md"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/kb-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate KB
        run: python3 "$KB_MANAGER" check

      - name: Rebuild sync manifest
        run: python3 scripts/build_sync_manifest.py

      - name: Commit to main
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Tidak ada perubahan."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A kb-inbox plugins/aigeothermal-pln sync-manifest.json
          rev=$(python3 -c "import json;print(json.load(open('sync-manifest.json'))['kb_revision'])")
          git commit -m "KB: ingest & sync manifest (KB revision ${rev})"
          git push origin HEAD:main

      - name: Fail if some inbox files were rejected
        if: steps.ingest.outputs.exit_code != '0'
        run: |
          echo "::error::Sebagian file di kb-inbox gagal diproses. Lihat ringkasan job; file tersebut tetap di kb-inbox sampai diperbaiki."
          exit 1
